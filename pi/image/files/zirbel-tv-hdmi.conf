# The box's TV console (AGENTS.md), installed as /etc/wireplumber/wireplumber.conf.d/90-zirbel-tv-hdmi.conf: its
# sound goes to the TV over HDMI, ahead of a headphone jack, which PipeWire would otherwise choose first.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*hdmi.*" } ]
    actions = { update-props = { priority.session = 3000, priority.driver = 3000 } }
  }
]
