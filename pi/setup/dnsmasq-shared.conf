# Installed as /etc/NetworkManager/dnsmasq-shared.d/zirbel-setup.conf. The Zirbel setup hotspot is the only connection
# NetworkManager shares on the box: while it runs, every name resolves to the box, so a phone's captive-portal check
# opens the setup page. No captive-portal option (RFC 8910) goes out in DHCP: it names an HTTPS API (RFC 8908) the box
# doesn't have, and a phone that finds none there may close its setup window.
address=/#/10.42.0.1
