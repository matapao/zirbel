<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111812">
  <title>Zirbel · Controller</title>
  <link rel="stylesheet" href="/pad.css">
  <script type="module" src="/pad.js"></script>
</head>
<body>
  <main id="join" class="join">
    <header><span class="mark" aria-hidden="true">✦</span> <strong>Zirbel</strong> <span>Controller</span></header>
    <form id="code-form" class="card">
      <label for="code">The code on the screen</label>
      <div class="row">
        <input id="code" name="code" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false"
          inputmode="text" placeholder="Code" required>
        <button class="primary">Join</button>
      </div>
    </form>
    <p id="message" class="message" role="status"></p>
  </main>
  <main id="pad" class="pad" aria-label="Controller" hidden>
    <div class="bar">
      <div class="shoulder"><button type="button" data-button="6">LT</button><button type="button" data-button="4">LB</button></div>
      <div class="middle">
        <button type="button" data-button="8" class="small">Select</button>
        <button id="place" type="button" class="place" aria-expanded="false" aria-controls="places">P1</button>
        <button type="button" data-button="9" class="small">Start</button>
      </div>
      <div class="shoulder"><button type="button" data-button="5">RB</button><button type="button" data-button="7">RT</button></div>
    </div>
    <div class="sticks">
      <div id="stick" class="stick" role="img" aria-label="Left stick: drag to steer"><div id="knob" class="knob"></div></div>
      <div class="dpad" aria-label="D-pad" role="group">
        <button type="button" data-button="12" aria-label="Up">▲</button>
        <button type="button" data-button="14" aria-label="Left">◀</button>
        <button type="button" data-button="15" aria-label="Right">▶</button>
        <button type="button" data-button="13" aria-label="Down">▼</button>
      </div>
    </div>
    <div class="face" role="group" aria-label="Buttons">
      <button type="button" data-button="3" class="y">Y</button>
      <button type="button" data-button="2" class="x">X</button>
      <button type="button" data-button="1" class="b">B</button>
      <button type="button" data-button="0" class="a">A</button>
    </div>
    <p id="status" class="status" role="status"></p>
    <section id="places" class="places" aria-label="Move to another place" hidden>
      <p>Move to a free place:</p>
      <div id="place-list" class="place-list"></div>
      <button id="places-close" type="button">Stay here</button>
    </section>
  </main>
  <p class="turn" aria-hidden="true">Turn your phone sideways to play.</p>
</body>
</html>
