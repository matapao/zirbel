# pnpm's settings (pnpm 12 reads them here). What comes into the lockfile, and what every install checks it against:
# - a version only once it has been out for a week (Dependabot waits as long);
minimumReleaseAge: 10080
# These versions were in package-lock.json before the move to pnpm and the week's wait (2026-11-24); each has waited
# it out by 2026-11-29, when this list goes. Only these exact versions: a newer one still waits.
minimumReleaseAgeExclude:
  - '@anthropic-ai/sdk@1.12.0'
  - '@babel/runtime@7.29.15'
  - '@hono/node-server@2.1.11'
  - 'express-rate-limit@8.7.5'
  - 'jose@6.2.18'
  - 'object-inspect@1.14.0'
  - 'pkce-challenge@5.0.2'
  - 'router@2.3.0'
  - 'standardwebhooks@1.3.0'
  - 'unbash@6.0.5'
  # The agent SDKs the harness library runs its agents through, at the versions it is made with; the library's own
  # settings name the same until 2026-11-27.
  - '@anthropic-ai/claude-agent-sdk@0.3.330'
  - '@openai/codex-sdk@0.171.0'
  - '@openai/codex@0.171.0'
# - no version whose publisher is proven less well than for the versions before it, checked for versions out less
#   than 30 days;
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200
# - a dependency's own dependencies only from the registry, never from git or a tarball's address.
blockExoticSubdeps: true
# The lockfile stays one YAML document: pnpm 12 otherwise writes it as two, pnpm's own first, and GitHub's dependency
# graph, Dependabot alerts and OSV-Scanner then read only pnpm (tested: 16 packages of 304). pnpm still switches to
# packageManager's version, and engines.pnpm stops pnpm 11.
pmOnFail: ignore
# No package runs code as it is installed. Each one with an install script is named here; one that isn't named fails
# the install until it is decided.
strictDepBuilds: true
allowBuilds:
  # It finds its own platform's binary, a package of its own; its script only checks for it.
  esbuild: false
# The harness library's settings for the agent SDKs, which pnpm takes from this file only:
# - the SDKs' own copies of Claude Code and Codex: the harness runs the person's own programs, so none is installed;
ignoredOptionalDependencies:
  - '@anthropic-ai/claude-agent-sdk-*'
  - '@openai/codex-*'
# - the Codex SDK writes its prompt to Codex with no listener for the pipe's errors, so a Codex that ends before it
#   reads a long prompt would end the editor. The library's patch adds the listener, and nothing else.
patchedDependencies:
  '@openai/codex-sdk@0.171.0': patches/@openai__codex-sdk@0.171.0.patch
