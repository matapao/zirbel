name: CodeQL
# CodeQL's security-extended queries on every push to main, every pull request and weekly, as code scanning alerts.
# The languages are this repository's (matrix below). Public repositories only: a private one needs GitHub Code
# Security for it.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  analyze:
    if: github.event.repository.visibility == 'public'
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # This repository's languages: actions, javascript-typescript, go (build-mode autobuild), python.
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}
