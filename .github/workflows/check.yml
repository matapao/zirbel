name: Check Zirbel
on: [push, pull_request]
permissions:
  contents: read # checkout only
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: zirbel
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: zirbel/.nvmrc
      - run: corepack enable pnpm
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: zirbel/go.mod
          cache: false # the module is stdlib-only; tools are pinned in scripts/
      # The two link: dependencies are submodules in deps/, at the commits this repository records.
      - name: Build the submodule dependencies
        working-directory: zirbel
        run: pnpm run deps
      - name: Install, build and test
        working-directory: zirbel
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm lint
          pnpm contracts --check
          pnpm build
          pnpm build:host "" linux/amd64 linux/arm64 linux/arm/7
          pnpm check:go
          pnpm coverage
          pnpm test:pi
          node dist/server.mjs --help
          pnpm exec playwright install --with-deps chromium
          pnpm test:browser
      - name: Formatting (report-only until the codebase is reformatted)
        working-directory: zirbel
        run: pnpm format:check || echo "::warning::Prettier formatting differs; run pnpm format"
      - name: Build the native host container
        working-directory: zirbel
        run: |
          docker build --check --file Dockerfile.host .
          docker build --file Dockerfile.host --tag zirbel-host-check .
          docker run --rm zirbel-host-check --help
      - name: Verify the host container starts
        working-directory: zirbel
        run: |
          docker build --check .
          docker build --tag zirbel-check .
          container=$(docker run --detach zirbel-check)
          trap 'docker rm --force "$container" >/dev/null' EXIT
          for _ in {1..10}; do
            if docker exec "$container" node --input-type=module -e 'const response = await fetch("http://127.0.0.1:4174/health", { signal: AbortSignal.timeout(1000) }); if (!response.ok) process.exitCode = 1' 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container"
          exit 1

  desktop:
    name: Desktop app (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: zirbel
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: zirbel/.nvmrc
      - run: corepack enable pnpm
      # pnpm run deps builds the spaces kernel's binary from its submodule.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: zirbel/go.mod
          cache: false
      - name: Build the editor the app runs
        working-directory: zirbel
        run: |
          pnpm run deps
          pnpm install --frozen-lockfile
          pnpm build
      # Its windows show on the runner's screen while Playwright drives them.
      - name: Build, lint, test, pack and test the packed app
        working-directory: zirbel/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm electron:fetch
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm pack:app
          pnpm test:packed
