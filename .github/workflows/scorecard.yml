name: Scorecard
# OpenSSF Scorecard: the repository's supply-chain posture, weekly and on main, as code scanning results and on the
# public API (the README's badge). Public repositories only: Scorecard publishes nothing for a private one.
on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: '41 4 * * 2'
  workflow_dispatch:
permissions: read-all

jobs:
  analysis:
    if: github.event.repository.visibility == 'public'
    name: Scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      security-events: write # the results, as code scanning alerts
      id-token: write # publishing the results to the public API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
