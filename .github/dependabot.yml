version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let a new release age a week before proposing it
    groups:
      # three.js and its types in one pull request; the build makes the games' three package from node_modules/three.
      three:
        patterns: ['three', '@types/three']
      dev-tools:
        dependency-type: development
    ignore:
      # The two link: dependencies are submodules in deps/; the gitsubmodule entry below updates them.
      - dependency-name: celler
      - dependency-name: '@matapao/vindu'
      # Node 24 is the runtime (.nvmrc, engines), so its types stay on 24.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  # The desktop app, a pnpm project of its own. One pull request per package, so Electron's come on their own.
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let a new release age a week before proposing it
    ignore:
      # Node 24 is the runtime (.nvmrc, engines), so its types stay on 24.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let a new commit age a week before proposing it
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let a new release age a week before proposing it
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let a new release age a week before proposing it
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let a new release age a week before proposing it
    ignore:
      # The image runs the same Node major as .nvmrc and engines; it moves with the project.
      - dependency-name: node
        update-types: ['version-update:semver-major']
