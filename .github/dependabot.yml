version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let a new release age a week before proposing it
    groups:
      dev-tools:
        dependency-type: development
    # The two link: dependencies are sibling checkouts, pinned by revision in CI.
    ignore:
      - dependency-name: celler
      - dependency-name: '@matapao/vindu'
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let a new release age a week before proposing it
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let a new release age a week before proposing it
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let a new release age a week before proposing it
